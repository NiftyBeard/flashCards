<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            background-color: #f4f4f9;
        }
        .container {
            width: 360px;
        }
        .folder-filter {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .folder-filter select {
            flex-grow: 1;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .backup-controls, .test-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
        }
        .backup-controls button, .test-controls button {
            flex: 1;
        }
        .form-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .form-container h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }
        input, textarea, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 10px 15px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-export { background-color: #28a745; }
        .btn-export:hover { background-color: #218838; }
        .btn-import { background-color: #17a2b8; }
        .btn-import:hover { background-color: #138496; }
        .btn-delete { background-color: #dc3545; }
        .btn-delete:hover { background-color: #bd2130; }
        .btn-test { background-color: #6f42c1; }
        .btn-test:hover { background-color: #593196; }
        .btn-end { background-color: #6c757d; }
        .btn-end:hover { background-color: #5a6268; }

        .card {
            width: 100%;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background-color: white;
            text-align: center;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .card-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        .tag {
            display: inline-block;
            background: #e9ecef;
            color: #495057;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        /* Test Mode Styles */
        .test-box {
            background: white;
            padding: 25px 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .test-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 15px;
        }
        .mc-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }
        .mc-btn {
            background-color: #f8f9fa;
            color: #212529;
            border: 1px solid #ced4da;
            text-align: left;
            padding: 12px 15px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .mc-btn:hover:not(:disabled) {
            background-color: #e2e6ea;
        }
        .mc-btn.correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724 !important;
            font-weight: bold;
        }
        .mc-btn.incorrect {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24 !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Topic / Folder Filter Header -->
        <div class="folder-filter" id="folder-filter-wrap">
            <label for="filter-folder"><strong>Topic:</strong></label>
            <select id="filter-folder" onchange="switchFolder(this.value)">
                <option value="All">All Topics</option>
            </select>
        </div>

        <!-- Backup & Restore Controls -->
        <div class="backup-controls" id="backup-controls-wrap">
            <button class="btn-export" onclick="exportCards()">Export JSON</button>
            <button class="btn-import" onclick="document.getElementById('import-file').click()">Import JSON</button>
            <input type="file" id="import-file" accept=".json" onchange="importCards(event)" style="display: none;">
        </div>

        <!-- Test Trigger Bar -->
        <div class="test-controls" id="test-controls-wrap">
            <button class="btn-test" id="btn-start-test" onclick="startTest()">Start Test Mode</button>
            <button class="btn-end" id="btn-end-test" onclick="endTest()" style="display: none;">Exit Test Mode</button>
        </div>

        <!-- Add Card Form -->
        <div class="form-container" id="form-wrap">
            <h3>Add New Flashcard</h3>
            <input type="text" id="front" placeholder="Front Side">
            <textarea id="back" placeholder="Back Side"></textarea>

            <select id="card-folder" onchange="toggleCustomFolderInput(this.value)">
                <option value="General">General</option>
                <option value="__new__">+ Create New Topic...</option>
            </select>
            <input type="text" id="custom-folder" placeholder="Enter topic name..." style="display: none;">

            <button onclick="addCard()">Add Card</button>
        </div>

        <!-- Dynamic Content Area -->
        <div id="main-content"></div>
    </div>

    <script type="module">
        import { openDB } from 'https://cdn.jsdelivr.net/npm/idb/build/index.js';

        let currentFolder = 'All';
        let isTestActive = false;
        let testQueue = [];
        let currentTestIndex = 0;
        let score = 0;
        let answered = false;

        const dbPromise = openDB('flashcards-db', 2, {
            upgrade(db, oldVersion, newVersion, transaction) {
                let cardStore;
                if (oldVersion < 1) {
                    cardStore = db.createObjectStore('cards', { keyPath: 'id', autoIncrement: true });
                } else {
                    cardStore = transaction.objectStore('cards');
                }

                if (oldVersion < 2) {
                    if (!cardStore.indexNames.contains('folder')) {
                        cardStore.createIndex('folder', 'folder');
                    }
                }
            },
        });

        // Utility: Fisher-Yates array shuffle
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        async function addCard() {
            const front = document.getElementById('front').value.trim();
            const back = document.getElementById('back').value.trim();
            const folderSelect = document.getElementById('card-folder').value;
            const customFolder = document.getElementById('custom-folder').value.trim();

            if (!front || !back) return;

            let folder = folderSelect === '__new__' ? (customFolder || 'General') : folderSelect;

            try {
                const db = await dbPromise;
                await db.add('cards', { front, back, folder });

                document.getElementById('front').value = '';
                document.getElementById('back').value = '';
                document.getElementById('custom-folder').value = '';
                document.getElementById('custom-folder').style.display = 'none';
                document.getElementById('card-folder').value = folder;

                renderApp();
            } catch (error) {
                console.error('Error adding card:', error);
            }
        }

        async function deleteCard(id) {
            try {
                const db = await dbPromise;
                await db.delete('cards', id);
                renderApp();
            } catch (error) {
                console.error('Error deleting card:', error);
            }
        }

        async function flipCard(id, buttonElement) {
            const cardElement = buttonElement.closest('.card');
            const db = await dbPromise;
            const card = await db.get('cards', id);

            const isFlipped = cardElement.dataset.flipped === 'true';
            const heading = cardElement.querySelector('h2');

            heading.textContent = isFlipped ? card.front : card.back;
            cardElement.dataset.flipped = (!isFlipped).toString();
        }

        function switchFolder(folder) {
            currentFolder = folder;
            renderCards();
        }

        function toggleCustomFolderInput(value) {
            const input = document.getElementById('custom-folder');
            input.style.display = value === '__new__' ? 'block' : 'none';
        }

        // --- TEST MODE LOGIC ---
        async function startTest() {
            const db = await dbPromise;
            let cards = currentFolder === 'All'
                ? await db.getAll('cards')
                : await db.getAllFromIndex('cards', 'folder', currentFolder);

            if (cards.length === 0) {
                alert('Add some flashcards to this topic before starting a test!');
                return;
            }

            isTestActive = true;
            testQueue = shuffleArray(cards);
            currentTestIndex = 0;
            score = 0;

            // Toggle visibility for Test Mode layout
            document.getElementById('form-wrap').style.display = 'none';
            document.getElementById('backup-controls-wrap').style.display = 'none';
            document.getElementById('folder-filter-wrap').style.display = 'none';
            document.getElementById('btn-start-test').style.display = 'none';
            document.getElementById('btn-end-test').style.display = 'block';

            renderTestQuestion();
        }

        function endTest() {
            isTestActive = false;

            document.getElementById('form-wrap').style.display = 'flex';
            document.getElementById('backup-controls-wrap').style.display = 'flex';
            document.getElementById('folder-filter-wrap').style.display = 'flex';
            document.getElementById('btn-start-test').style.display = 'block';
            document.getElementById('btn-end-test').style.display = 'none';

            renderApp();
        }

        async function renderTestQuestion() {
            const container = document.getElementById('main-content');

            if (currentTestIndex >= testQueue.length) {
                // Test complete summary
                const pct = Math.round((score / testQueue.length) * 100);
                container.innerHTML = `
                    <div class="test-box">
                        <h2>Test Complete! 🎉</h2>
                        <p style="font-size: 18px;">Score: <strong>${score} / ${testQueue.length}</strong> (${pct}%)</p>
                        <div style="display:flex; gap:10px; margin-top: 20px;">
                            <button onclick="startTest()" style="flex:1;" class="btn-test">Retake Test</button>
                            <button onclick="endTest()" style="flex:1;" class="btn-end">Exit</button>
                        </div>
                    </div>
                `;
                return;
            }

            answered = false;
            const currentCard = testQueue[currentTestIndex];
            const db = await dbPromise;
            const allCards = await db.getAll('cards');

            // Collect distractor choices from other cards
            let distractors = allCards
                .map(c => c.back)
                .filter(backVal => backVal !== currentCard.back);

            // Deduplicate distractors
            distractors = Array.from(new Set(distractors));
            distractors = shuffleArray(distractors);

            // Ensure 3 distractors exist using plausible fallback options if deck is small
            const fallbacks = ["None of the above", "All of the above", "Not enough info provided", "Opposite meaning"];
            let fallbackIdx = 0;
            while (distractors.length < 3) {
                const fb = fallbacks[fallbackIdx % fallbacks.length];
                if (!distractors.includes(fb) && fb !== currentCard.back) {
                    distractors.push(fb);
                }
                fallbackIdx++;
            }

            // Shuffle 1 correct answer + 3 distractors
            const options = shuffleArray([
                currentCard.back,
                distractors[0],
                distractors[1],
                distractors[2]
            ]);

            container.innerHTML = `
                <div class="test-box">
                    <div class="test-header">
                        <span>Topic: <strong>${currentCard.folder || 'General'}</strong></span>
                        <span>Question ${currentTestIndex + 1} of ${testQueue.length}</span>
                    </div>
                    <span class="tag">Prompt</span>
                    <h2>${currentCard.front}</h2>
                    <div class="mc-options">
                        ${options.map(opt => `
                            <button class="mc-btn" onclick="handleAnswer(this, \`${escapeJsString(opt)}\`, \`${escapeJsString(currentCard.back)}\`)">
                                ${escapeHtml(opt)}
                            </button>
                        `).join('')}
                    </div>
                    <button id="next-btn" style="display:none; width:100%; margin-top:10px;" onclick="nextQuestion()">Next Question →</button>
                </div>
            `;
        }

        function handleAnswer(buttonEl, selectedOpt, correctOpt) {
            if (answered) return;
            answered = true;

            const allOptionBtns = document.querySelectorAll('.mc-btn');
            allOptionBtns.forEach(btn => {
                btn.disabled = true;
                if (btn.innerText.trim() === correctOpt) {
                    btn.classList.add('correct');
                }
            });

            if (selectedOpt === correctOpt) {
                score++;
            } else {
                buttonEl.classList.add('incorrect');
            }

            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentTestIndex++;
            renderTestQuestion();
        }

        function escapeJsString(str) {
            return str.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // --- BACKUP & RESTORE LOGIC ---
        async function exportCards() {
            try {
                const db = await dbPromise;
                const cards = await db.getAll('cards');

                if (cards.length === 0) {
                    alert('No cards available to export.');
                    return;
                }

                const jsonString = JSON.stringify(cards, null, 2);
                const blob = new Blob([jsonString], { type: 'application/json' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = `flashcards-backup-${new Date().toISOString().slice(0, 10)}.json`;
                a.click();

                URL.revokeObjectURL(url);
            } catch (error) {
                console.error('Export failed:', error);
                alert('Failed to export cards.');
            }
        }

        async function importCards(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const importedCards = JSON.parse(e.target.result);

                    if (!Array.isArray(importedCards)) {
                        throw new Error('Invalid format: JSON must be an array of flashcards.');
                    }

                    const db = await dbPromise;
                    const tx = db.transaction('cards', 'readwrite');

                    for (const card of importedCards) {
                        if (card.front && card.back) {
                            await tx.store.add({
                                front: card.front,
                                back: card.back,
                                folder: card.folder || 'General'
                            });
                        }
                    }

                    await tx.done;
                    alert('Flashcards imported successfully!');
                    renderApp();
                } catch (error) {
                    console.error('Import failed:', error);
                    alert(`Import failed: ${error.message}`);
                } finally {
                    event.target.value = '';
                }
            };

            reader.readAsText(file);
        }

        async function renderApp() {
            if (isTestActive) return;

            const db = await dbPromise;
            const allCards = await db.getAll('cards');

            const folders = Array.from(new Set(allCards.map(c => c.folder || 'General')));

            const cardFolderSelect = document.getElementById('card-folder');
            cardFolderSelect.innerHTML = folders.map(f => `<option value="${f}">${f}</option>`).join('')
                + `<option value="__new__">+ Create New Topic...</option>`;

            const filterSelect = document.getElementById('filter-folder');
            filterSelect.innerHTML = `<option value="All">All Topics</option>`
                + folders.map(f => `<option value="${f}" ${f === currentFolder ? 'selected' : ''}>${f}</option>`).join('');

            renderCards();
        }

        async function renderCards() {
            if (isTestActive) return;

            const db = await dbPromise;
            let cards = currentFolder === 'All'
                ? await db.getAll('cards')
                : await db.getAllFromIndex('cards', 'folder', currentFolder);

            const container = document.getElementById('main-content');
            container.innerHTML = '';

            if (cards.length === 0) {
                container.innerHTML = '<p style="text-align:center;">No cards found in this topic.</p>';
                return;
            }

            cards.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.classList.add('card');
                cardElement.dataset.flipped = 'false';
                cardElement.innerHTML = `
                    <span class="tag">${card.folder || 'General'}</span>
                    <h2>${escapeHtml(card.front)}</h2>
                    <div class="card-actions">
                        <button onclick="flipCard(${card.id}, this)">Flip</button>
                        <button class="btn-delete" onclick="deleteCard(${card.id})">Delete</button>
                    </div>
                `;
                container.appendChild(cardElement);
            });
        }

        // Global bindings
        window.addCard = addCard;
        window.deleteCard = deleteCard;
        window.flipCard = flipCard;
        window.switchFolder = switchFolder;
        window.toggleCustomFolderInput = toggleCustomFolderInput;
        window.exportCards = exportCards;
        window.importCards = importCards;
        window.startTest = startTest;
        window.endTest = endTest;
        window.handleAnswer = handleAnswer;
        window.nextQuestion = nextQuestion;

        renderApp();
    </script>
</body>
</html>
