<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard App</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
        }
        .card {
            width: 300px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background-color: white;
            text-align: center;
        }
        .card h2 {
            margin-top: 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
        }
        button:hover {
            background-color: #0056b3;
        }
        .form-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        input, textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <input type="text" id="front" placeholder="Front Side">
        <textarea id="back" placeholder="Back Side"></textarea>
        <button onclick="addCard()">Add Card</button>
        <button onclick="showAllCards()">Show All Cards</button>
    </div>
    <div class="card" id="flashcard">
        <h2>Front Side</h2>
        <button onclick="flipCard()">Flip</button>
    </div>

    <div id="card-list"></div>

    <!-- Load the idb library -->
    <script type="module">
        import { openDB } from 'https://cdn.jsdelivr.net/npm/idb/build/index.js';

        const dbPromise = openDB('flashcards-db', 1, {
            upgrade(db) {
                if (!db.objectStoreNames.contains('cards')) {
                    db.createObjectStore('cards', { keyPath: 'id', autoIncrement: true });
                }
            },
        });

        async function addCard(front, back) {
            try {
                const db = await dbPromise;
                const transaction = db.transaction(['cards'], 'readwrite');
                const store = transaction.objectStore('cards');
                const request = store.add({ front, back });

                request.onsuccess = () => {
                    console.log('Card added successfully!');
                };

                request.onerror = (event) => {
                    console.error('Error adding card:', event.target.error);
                };
            } catch (error) {
                console.error('Database error:', error);
            }
        }

        async function fetchCards() {
            try {
                const db = await dbPromise;
                const transaction = db.transaction(['cards'], 'readonly');
                const store = transaction.objectStore('cards');
                return await store.getAll();
            } catch (error) {
                console.error('Database error:', error);
            }
        }

        async function showAllCards() {
            const cards = await fetchCards();
            const cardList = document.getElementById('card-list');
            cardList.innerHTML = '';

            if (cards.length === 0) {
                cardList.innerHTML = '<p>No cards found.</p>';
            } else {
                cards.forEach(card => {
                    const cardElement = document.createElement('div');
                    cardElement.classList.add('card');
                    cardElement.innerHTML = `<h2>${card.front}</h2><button onclick="flipCard()">Flip</button>`;
                    cardList.appendChild(cardElement);
                });
            }
        }

        // Optionally, display all cards when the page loads
        window.onload = () => {
            showAllCards();
        };
    </script>
</body>
</html>
