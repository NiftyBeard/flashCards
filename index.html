<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            background-color: #f4f4f9;
        }
        .card {
            width: 300px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background-color: white;
            text-align: center;
            margin-bottom: 15px;
        }
        .form-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 300px;
            margin-bottom: 30px;
        }
        input, textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <input type="text" id="front" placeholder="Front Side">
        <textarea id="back" placeholder="Back Side"></textarea>
        <button onclick="addCard()">Add Card</button>
        <button onclick="showAllCards()">Show All Cards</button>
    </div>

    <div id="card-list"></div>

    <script type="module">
        import { openDB } from 'https://cdn.jsdelivr.net/npm/idb/build/index.js';

        const dbPromise = openDB('flashcards-db', 1, {
            upgrade(db) {
                if (!db.objectStoreNames.contains('cards')) {
                    db.createObjectStore('cards', { keyPath: 'id', autoIncrement: true });
                }
            },
        });

        async function addCard() {
            const front = document.getElementById('front').value;
            const back = document.getElementById('back').value;

            if (!front || !back) return;

            try {
                const db = await dbPromise;
                await db.add('cards', { front, back });
                document.getElementById('front').value = '';
                document.getElementById('back').value = '';
                showAllCards();
            } catch (error) {
                console.error('Error adding card:', error);
            }
        }

        async function showAllCards() {
            const db = await dbPromise;
            const cards = await db.getAll('cards');
            const cardList = document.getElementById('card-list');
            cardList.innerHTML = '';

            if (cards.length === 0) {
                cardList.innerHTML = '<p>No cards found.</p>';
                return;
            }

            cards.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.classList.add('card');
                cardElement.dataset.flipped = 'false';
                cardElement.innerHTML = `
                    <h2>${card.front}</h2>
                    <button onclick="flipCard(${card.id}, this)">Flip</button>
                `;
                cardList.appendChild(cardElement);
            });
        }

        async function flipCard(id, buttonElement) {
            const cardElement = buttonElement.closest('.card');
            const db = await dbPromise;
            const card = await db.get('cards', id);
            
            const isFlipped = cardElement.dataset.flipped === 'true';
            const heading = cardElement.querySelector('h2');
            
            heading.textContent = isFlipped ? card.front : card.back;
            cardElement.dataset.flipped = (!isFlipped).toString();
        }

        // Bind functions to window so inline onclick handlers work
        window.addCard = addCard;
        window.showAllCards = showAllCards;
        window.flipCard = flipCard;

        // Initial render
        showAllCards();
    </script>
</body>
</html>
