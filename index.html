<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard App</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
        }
        .card {
            width: 300px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background-color: white;
            text-align: center;
        }
        .card h2 {
            margin-top: 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
        }
        button:hover {
            background-color: #0056b3;
        }
        .form-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        input, textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .test-container {
            display: none;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <input type="text" id="front" placeholder="Front Side">
        <textarea id="back" placeholder="Back Side"></textarea>
        <button onclick="addCard()">Add Card</button>
        <button onclick="startTest()">Start Test</button>
        <button onclick="endTest()">End Test</button>
    </div>

    <div class="card" id="flashcard">
        <h2>Front Side</h2>
        <button onclick="flipCard(1)">Flip</button> <!-- Assuming a default card ID for testing -->
    </div>

    <div id="card-list"></div>

    <div class="test-container" id="test-container">
        <div id="question"></div>
        <ul id="choices">
            <li><input type="radio" name="choice"> Option 1</li>
            <li><input type="radio" name="choice"> Option 2</li>
            <li><input type="radio" name="choice"> Option 3</li>
            <li><input type="radio" name="choice"> Option 4</li>
        </ul>
        <button onclick="checkAnswer()">Submit Answer</button>
    </div>

    <!-- Load the idb library and script at the bottom of the body -->
    <script type="module">
        import { openDB } from 'https://cdn.jsdelivr.net/npm/idb/build/index.js';

        const dbPromise = openDB('flashcards-db', 1, {
            upgrade(db) {
                if (!db.objectStoreNames.contains('cards')) {
                    db.createObjectStore('cards', { keyPath: 'id', autoIncrement: true });
                }
            },
        });

        let cards = [];
        let currentCardIndex = -1;

        async function addCard() {
            const front = document.getElementById('front').value;
            const back = document.getElementById('back').value;

            try {
                const db = await dbPromise;
                const transaction = db.transaction(['cards'], 'readwrite');
                const store = transaction.objectStore('cards');
                const request = store.add({ front, back });

                request.onsuccess = () => {
                    console.log('Card added successfully!');
                    document.getElementById('front').value = '';
                    document.getElementById('back').value = '';
                    showAllCards();
                };

                request.onerror = (event) => {
                    console.error('Error adding card:', event.target.error);
                };
            } catch (error) {
                console.error('Database error:', error);
            }
        }

        async function fetchCards() {
            try {
                const db = await dbPromise;
                const transaction = db.transaction(['cards'], 'readonly');
                const store = transaction.objectStore('cards');
                return await store.getAll();
            } catch (error) {
                console.error('Database error:', error);
            }
        }

        async function showAllCards() {
            cards = await fetchCards();
            if (cards.length > 0) {
                currentCardIndex = -1;
                document.getElementById('card-list').innerHTML = '';
                cards.forEach(card => {
                    const cardElement = document.createElement('div');
                    cardElement.classList.add('card');
                    cardElement.innerHTML = `<h2>${card.front}</h2><button onclick="flipCard(${card.id})">Flip</button>`;
                    document.getElementById('card-list').appendChild(cardElement);
                });
            }
        }

        function flipCard(id) {
            const cardIndex = cards.findIndex(card => card.id === id);
            if (cardIndex !== -1) {
                currentCardIndex = cardIndex;
                document.getElementById('flashcard').innerHTML = `<h2>${cards[cardIndex].back}</h2>`;
            }
        }

        function startTest() {
            const shuffledCards = [...cards];
            shuffle(shuffledCards);
            currentCardIndex = 0;
            showTestQuestion();
        }

        function endTest() {
            document.getElementById('test-container').style.display = 'none';
            showAllCards();
        }

        function showTestQuestion() {
            if (currentCardIndex < cards.length) {
                const card = cards[currentCardIndex];
                document.getElementById('question').innerText = `What is the front of card ${card.id + 1}?`;
                const choices = ['A', 'B', 'C', 'D'];
                shuffle(choices);
                document.getElementById('choices').innerHTML = '';
                for (let i = 0; i < choices.length; i++) {
                    const choiceElement = document.createElement('li');
                    choiceElement.innerHTML = `<input type="radio" name="choice" id="choice${i}" value="${card.front}"> ${card.front}`;
                    if (i === Math.floor(Math.random() * choices.length)) {
                        choiceElement.innerHTML += ` (Correct)`;
                    }
                    document.getElementById('choices').appendChild(choiceElement);
                }
                document.getElementById('test-container').style.display = 'block';
            } else {
                endTest();
            }
        }

        function checkAnswer() {
            const selectedChoice = document.querySelector('input[name="choice"]:checked');
            if (selectedChoice) {
                const correctAnswer = cards[currentCardIndex].front;
                if (selectedChoice.value === correctAnswer) {
                    alert('Correct!');
                } else {
                    alert(`Incorrect! The correct answer is: ${correctAnswer}`);
                }
                document.getElementById('test-container').style.display = 'none';
                currentCardIndex++;
                showTestQuestion();
            } else {
                alert('Please select an answer.');
            }
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Optionally, display all cards when the page loads
        window.onload = () => {
            showAllCards();
        };
    </script>
</body>
</html>
